name: Build PadMap APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Tulis file proyek
        run: |
          mkdir -p app/src/main/java/com/rizal/padmap app/src/main/res/values app/src/main/res/xml
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "PadMap"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.rizal.padmap"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.rizal.padmap"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "1.1"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="@string/app_name" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".PadService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">PadMap</string>
              <string name="desc">Mengubah tombol gamepad menjadi ketukan layar di titik yang kamu atur, dengan bola melayang untuk pemetaan. Tidak membaca isi layar.</string>
          </resources>
          EOF
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents"
              android:canPerformGestures="true"
              android:canRequestFilterKeyEvents="true"
              android:description="@string/desc"
              android:notificationTimeout="100" />
          EOF
          cat > app/src/main/java/com/rizal/padmap/Pad.kt <<'EOF'
          package com.rizal.padmap

          import android.content.Context
          import android.view.KeyEvent

          object Pad {
              var paused = false

              val keys = listOf(
                  KeyEvent.KEYCODE_BUTTON_A to "A", KeyEvent.KEYCODE_BUTTON_B to "B",
                  KeyEvent.KEYCODE_BUTTON_X to "X", KeyEvent.KEYCODE_BUTTON_Y to "Y",
                  KeyEvent.KEYCODE_BUTTON_L1 to "LB", KeyEvent.KEYCODE_BUTTON_R1 to "RB",
                  KeyEvent.KEYCODE_BUTTON_L2 to "LT", KeyEvent.KEYCODE_BUTTON_R2 to "RT",
                  KeyEvent.KEYCODE_BUTTON_THUMBL to "L3", KeyEvent.KEYCODE_BUTTON_THUMBR to "R3",
                  KeyEvent.KEYCODE_DPAD_UP to "Atas", KeyEvent.KEYCODE_DPAD_DOWN to "Bawah",
                  KeyEvent.KEYCODE_DPAD_LEFT to "Kiri", KeyEvent.KEYCODE_DPAD_RIGHT to "Kanan"
              )

              fun prefs(c: Context) = c.getSharedPreferences("pad", Context.MODE_PRIVATE)

              fun load(c: Context, code: Int): Triple<Float, Float, Boolean>? {
                  val s = prefs(c).getString("k$code", null) ?: return null
                  return try {
                      val p = s.split(",")
                      Triple(p[0].toFloat(), p[1].toFloat(), p[2] == "1")
                  } catch (e: Exception) {
                      null
                  }
              }

              fun save(c: Context, code: Int, x: Float, y: Float, on: Boolean) {
                  prefs(c).edit().putString("k$code", "$x,$y,${if (on) 1 else 0}").apply()
              }

              fun resetKeys(c: Context) {
                  val e = prefs(c).edit()
                  keys.forEach { e.remove("k${it.first}") }
                  e.apply()
              }

              fun bubbleOn(c: Context) = prefs(c).getBoolean("bubble", true)

              fun setBubble(c: Context, on: Boolean) {
                  prefs(c).edit().putBoolean("bubble", on).apply()
              }

              fun bubblePos(c: Context): Pair<Int, Int> =
                  Pair(prefs(c).getInt("bx", 0), prefs(c).getInt("by", 300))

              fun setBubblePos(c: Context, x: Int, y: Int) {
                  prefs(c).edit().putInt("bx", x).putInt("by", y).apply()
              }
          }
          EOF
          cat > app/src/main/java/com/rizal/padmap/PadService.kt <<'EOF'
          package com.rizal.padmap

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Context
          import android.content.Intent
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.os.Build
          import android.util.DisplayMetrics
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Toast

          class BubbleView(c: Context) : View(c) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)

              override fun onDraw(cv: Canvas) {
                  val r = width / 2f
                  p.style = Paint.Style.FILL
                  p.color = if (Pad.paused) Color.argb(235, 90, 96, 110) else Color.argb(235, 47, 163, 107)
                  cv.drawCircle(r, r, r - 2f, p)
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 3f
                  p.color = Color.WHITE
                  cv.drawCircle(r, r, r - 3f, p)
                  p.style = Paint.Style.FILL
                  p.textAlign = Paint.Align.CENTER
                  p.textSize = r * 0.7f
                  p.isFakeBoldText = true
                  cv.drawText("PM", r, r + p.textSize * 0.35f, p)
              }
          }

          class PadService : AccessibilityService() {
              companion object {
                  var inst: PadService? = null
              }

              private var wm: WindowManager? = null
              private var bubble: View? = null
              private var editor: PadView? = null

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  inst = this
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  refresh()
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  closeEditor(false)
                  hideBubble()
                  inst = null
                  return super.onUnbind(intent)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              fun refresh() {
                  if (Pad.bubbleOn(this)) showBubble() else hideBubble()
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun showBubble() {
                  val w = wm ?: return
                  if (bubble != null) return
                  val v = BubbleView(this)
                  val size = dp(52)
                  val lp = WindowManager.LayoutParams(
                      size, size,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  val pos = Pad.bubblePos(this)
                  lp.x = pos.first
                  lp.y = pos.second
                  var sx = 0f
                  var sy = 0f
                  var ox = 0
                  var oy = 0
                  var moved = false
                  v.setOnTouchListener { _, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              sx = e.rawX
                              sy = e.rawY
                              ox = lp.x
                              oy = lp.y
                              moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - sx
                              val dy = e.rawY - sy
                              if (Math.abs(dx) > 10 || Math.abs(dy) > 10) moved = true
                              if (moved) {
                                  lp.x = ox + dx.toInt()
                                  lp.y = oy + dy.toInt()
                                  w.updateViewLayout(v, lp)
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              if (moved) {
                                  Pad.setBubblePos(this, lp.x, lp.y)
                              } else if (e.eventTime - e.downTime > 600) {
                                  Pad.paused = !Pad.paused
                                  v.invalidate()
                                  Toast.makeText(this, if (Pad.paused) "PadMap dijeda" else "PadMap aktif", Toast.LENGTH_SHORT).show()
                              } else {
                                  openEditor()
                              }
                          }
                      }
                      true
                  }
                  w.addView(v, lp)
                  bubble = v
              }

              private fun hideBubble() {
                  val v = bubble ?: return
                  try {
                      wm?.removeView(v)
                  } catch (e: Exception) {
                  }
                  bubble = null
              }

              private fun openEditor() {
                  val w = wm ?: return
                  if (editor != null) return
                  val v = PadView(this) { closeEditor(true) }
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  w.addView(v, lp)
                  editor = v
                  bubble?.visibility = View.GONE
              }

              private fun closeEditor(save: Boolean) {
                  val v = editor ?: return
                  if (save) v.saveAll()
                  try {
                      wm?.removeView(v)
                  } catch (e: Exception) {
                  }
                  editor = null
                  bubble?.visibility = View.VISIBLE
              }

              override fun onKeyEvent(event: KeyEvent): Boolean {
                  val ed = editor
                  if (ed != null) {
                      if (event.action == KeyEvent.ACTION_DOWN) ed.flash(event.keyCode)
                      return Pad.keys.any { it.first == event.keyCode }
                  }
                  if (Pad.paused) return false
                  val p = Pad.load(this, event.keyCode) ?: return false
                  if (!p.third) return false
                  if (event.action == KeyEvent.ACTION_DOWN && event.repeatCount == 0) tap(p.first, p.second)
                  return true
              }

              @Suppress("DEPRECATION")
              private fun screen(): DisplayMetrics {
                  val dm = DisplayMetrics()
                  wm?.defaultDisplay?.getRealMetrics(dm)
                  return dm
              }

              private fun tap(fx: Float, fy: Float) {
                  val dm = screen()
                  val path = Path()
                  path.moveTo(fx * dm.widthPixels, fy * dm.heightPixels)
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 40))
                      .build()
                  dispatchGesture(g, null, null)
              }
          }
          EOF
          cat > app/src/main/java/com/rizal/padmap/MainActivity.kt <<'EOF'
          package com.rizal.padmap

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView

          class MainActivity : Activity() {
              private lateinit var dot: View
              private lateinit var st: TextView
              private lateinit var sw: Switch
              private lateinit var keys: TextView

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun bg(color: String, r: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(Color.parseColor(color))
                  g.cornerRadius = dp(r).toFloat()
                  return g
              }

              private fun tv(t: String, size: Float, color: String = "#FFFFFF", bold: Boolean = false): TextView {
                  val x = TextView(this)
                  x.text = t
                  x.textSize = size
                  x.setTextColor(Color.parseColor(color))
                  if (bold) x.setTypeface(null, Typeface.BOLD)
                  return x
              }

              private fun card(): LinearLayout {
                  val l = LinearLayout(this)
                  l.orientation = LinearLayout.VERTICAL
                  l.setPadding(dp(16), dp(16), dp(16), dp(16))
                  l.background = bg("#1B2438", 16)
                  val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  lp.bottomMargin = dp(12)
                  l.layoutParams = lp
                  return l
              }

              private fun btn(t: String, primary: Boolean, f: () -> Unit): Button {
                  val b = Button(this)
                  b.text = t
                  b.isAllCaps = false
                  b.setTextColor(Color.parseColor(if (primary) "#08331F" else "#FFFFFF"))
                  b.background = bg(if (primary) "#2FA36B" else "#2B3650", 12)
                  b.setOnClickListener { f() }
                  val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(48))
                  lp.topMargin = dp(10)
                  b.layoutParams = lp
                  return b
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(dp(18), dp(28), dp(18), dp(28))
                  root.addView(tv("PadMap", 30f, "#FFFFFF", true))
                  val sub = tv("Ubah tombol gamepad jadi ketukan layar", 14f, "#9AA6C0")
                  sub.setPadding(0, 0, 0, dp(18))
                  root.addView(sub)

                  val c1 = card()
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  dot = View(this)
                  val dlp = LinearLayout.LayoutParams(dp(12), dp(12))
                  dlp.rightMargin = dp(10)
                  dot.layoutParams = dlp
                  st = tv("", 16f, "#FFFFFF", true)
                  row.addView(dot)
                  row.addView(st)
                  c1.addView(row)
                  c1.addView(btn("Buka pengaturan Aksesibilitas", true) { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) })
                  root.addView(c1)

                  val c2 = card()
                  sw = Switch(this)
                  sw.text = "Bola melayang"
                  sw.setTextColor(Color.WHITE)
                  sw.textSize = 16f
                  c2.addView(sw)
                  val d2 = tv("Ketuk bola PM untuk membuka pemetaan di atas game. Tahan bola untuk jeda atau lanjut. Bola bisa digeser.", 13f, "#9AA6C0")
                  d2.setPadding(0, dp(8), 0, 0)
                  c2.addView(d2)
                  root.addView(c2)

                  val c3 = card()
                  c3.addView(tv("Tombol aktif", 14f, "#9AA6C0"))
                  keys = tv("", 16f, "#FFFFFF", true)
                  c3.addView(keys)
                  root.addView(c3)

                  val c4 = card()
                  c4.addView(tv("Cara pakai", 14f, "#9AA6C0"))
                  val how = tv("1. Aktifkan PadMap di Aksesibilitas.\n2. Buka game, lalu ketuk bola 
