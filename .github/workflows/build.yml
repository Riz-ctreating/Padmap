name: Build PadMap APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Tulis file proyek
        run: |
          mkdir -p .
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "PadMap"
          include(":app")
          EOF
          mkdir -p .
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          mkdir -p .
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.rizal.padmap"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.rizal.padmap"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 4
                  versionName = "1.3"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:label="@string/app_name" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".PadService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">PadMap</string>
              <string name="desc">Mengubah tombol gamepad menjadi ketukan layar di titik yang kamu atur, dengan bola melayang untuk pemetaan. Tidak membaca isi layar.</string>
          </resources>
          EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents"
              android:canPerformGestures="true"
              android:canRequestFilterKeyEvents="true"
              android:description="@string/desc"
              android:notificationTimeout="100" />
          EOF
          mkdir -p app/src/main/java/com/rizal/padmap
          cat > app/src/main/java/com/rizal/padmap/Pad.kt <<'EOF'
          package com.rizal.padmap

          import android.content.Context
          import android.util.DisplayMetrics
          import android.view.KeyEvent
          import android.view.WindowManager

          object Pad {
              var paused = false

              val keys = listOf(
                  KeyEvent.KEYCODE_BUTTON_A to "A", KeyEvent.KEYCODE_BUTTON_B to "B",
                  KeyEvent.KEYCODE_BUTTON_X to "X", KeyEvent.KEYCODE_BUTTON_Y to "Y",
                  KeyEvent.KEYCODE_BUTTON_L1 to "LB", KeyEvent.KEYCODE_BUTTON_R1 to "RB",
                  KeyEvent.KEYCODE_BUTTON_L2 to "LT", KeyEvent.KEYCODE_BUTTON_R2 to "RT",
                  KeyEvent.KEYCODE_BUTTON_THUMBL to "L3", KeyEvent.KEYCODE_BUTTON_THUMBR to "R3",
                  KeyEvent.KEYCODE_DPAD_UP to "Atas", KeyEvent.KEYCODE_DPAD_DOWN to "Bawah",
                  KeyEvent.KEYCODE_DPAD_LEFT to "Kiri", KeyEvent.KEYCODE_DPAD_RIGHT to "Kanan",
                  KeyEvent.KEYCODE_BUTTON_START to "Start", KeyEvent.KEYCODE_BUTTON_SELECT to "Select",
                  KeyEvent.KEYCODE_BUTTON_MODE to "Mode"
              )

              private val ignored = setOf(
                  KeyEvent.KEYCODE_BACK, KeyEvent.KEYCODE_HOME, KeyEvent.KEYCODE_POWER,
                  KeyEvent.KEYCODE_VOLUME_UP, KeyEvent.KEYCODE_VOLUME_DOWN, KeyEvent.KEYCODE_VOLUME_MUTE,
                  KeyEvent.KEYCODE_APP_SWITCH, KeyEvent.KEYCODE_CAMERA, KeyEvent.KEYCODE_UNKNOWN
              )

              fun isMappable(code: Int) = code !in ignored

              fun label(code: Int): String =
                  KeyEvent.keyCodeToString(code).removePrefix("KEYCODE_").removePrefix("BUTTON_").replace("_", " ").take(6)

              fun extras(c: Context): List<Int> =
                  (prefs(c).getString("extras", "") ?: "").split(",").mapNotNull { it.toIntOrNull() }

              fun addExtra(c: Context, code: Int) {
                  val cur = extras(c)
                  if (code in cur) return
                  prefs(c).edit().putString("extras", (cur + code).joinToString(",")).apply()
              }

              fun all(c: Context): List<Pair<Int, String>> =
                  keys + extras(c).filter { code -> keys.none { it.first == code } }.map { Pair(it, label(it)) }

              @Suppress("DEPRECATION")
              fun real(c: Context): DisplayMetrics {
                  val dm = DisplayMetrics()
                  (c.getSystemService(Context.WINDOW_SERVICE) as WindowManager).defaultDisplay.getRealMetrics(dm)
                  return dm
              }

              fun prefs(c: Context) = c.getSharedPreferences("pad", Context.MODE_PRIVATE)

              fun load(c: Context, code: Int): Triple<Float, Float, Boolean>? {
                  val s = prefs(c).getString("k$code", null) ?: return null
                  return try {
                      val p = s.split(",")
                      Triple(p[0].toFloat(), p[1].toFloat(), p[2] == "1")
                  } catch (e: Exception) {
                      null
                  }
              }

              fun save(c: Context, code: Int, x: Float, y: Float, on: Boolean) {
                  prefs(c).edit().putString("k$code", "$x,$y,${if (on) 1 else 0}").apply()
              }

              fun resetKeys(c: Context) {
                  val e = prefs(c).edit()
                  all(c).forEach { e.remove("k${it.first}") }
                  e.remove("extras")
                  e.apply()
              }

              fun bubbleOn(c: Context) = prefs(c).getBoolean("bubble", true)

              fun setBubble(c: Context, on: Boolean) {
                  prefs(c).edit().putBoolean("bubble", on).apply()
              }

              fun bubblePos(c: Context): Pair<Int, Int> =
                  Pair(prefs(c).getInt("bx", 0), prefs(c).getInt("by", 300))

              fun setBubblePos(c: Context, x: Int, y: Int) {
                  prefs(c).edit().putInt("bx", x).putInt("by", y).apply()
              }
          }
          EOF
          mkdir -p app/src/main/java/com/rizal/padmap
          cat > app/src/main/java/com/rizal/padmap/PadService.kt <<'EOF'
          package com.rizal.padmap

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Context
          import android.content.Intent
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.os.Build
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Toast

          class BubbleView(c: Context) : View(c) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)

              override fun onDraw(cv: Canvas) {
                  val r = width / 2f
                  p.style = Paint.Style.FILL
                  p.color = if (Pad.paused) Color.argb(235, 90, 96, 110) else Color.argb(235, 47, 163, 107)
                  cv.drawCircle(r, r, r - 2f, p)
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 3f
                  p.color = Color.WHITE
                  cv.drawCircle(r, r, r - 3f, p)
                  p.style = Paint.Style.FILL
                  p.textAlign = Paint.Align.CENTER
                  p.textSize = r * 0.7f
                  p.isFakeBoldText = true
                  cv.drawText("PM", r, r + p.textSize * 0.35f, p)
              }
          }

          class PadService : AccessibilityService() {
              companion object {
                  var inst: PadService? = null
              }

              private var wm: WindowManager? = null
              private var bubble: View? = null
              private var editor: PadView? = null

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  inst = this
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  refresh()
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  closeEditor(false)
                  hideBubble()
                  inst = null
                  return super.onUnbind(intent)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              fun refresh() {
                  if (Pad.bubbleOn(this)) showBubble() else hideBubble()
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun showBubble() {
                  val w = wm ?: return
                  if (bubble != null) return
                  val v = BubbleView(this)
                  val size = dp(52)
                  val lp = WindowManager.LayoutParams(
                      size, size,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  val pos = Pad.bubblePos(this)
                  lp.x = pos.first
                  lp.y = pos.second
                  var sx = 0f
                  var sy = 0f
                  var ox = 0
                  var oy = 0
                  var moved = false
                  v.setOnTouchListener { _, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              sx = e.rawX
                              sy = e.rawY
                              ox = lp.x
                              oy = lp.y
                              moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - sx
                              val dy = e.rawY - sy
                              if (Math.abs(dx) > 10 || Math.abs(dy) > 10) moved = true
                              if (moved) {
                                  lp.x = ox + dx.toInt()
                                  lp.y = oy + dy.toInt()
                                  w.updateViewLayout(v, lp)
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              if (moved) {
                                  Pad.setBubblePos(this, lp.x, lp.y)
                              } else if (e.eventTime - e.downTime > 600) {
                                  Pad.paused = !Pad.paused
                                  v.invalidate()
                                  Toast.makeText(this, if (Pad.paused) "PadMap dijeda" else "PadMap aktif", Toast.LENGTH_SHORT).show()
                              } else {
                                  openEditor()
                              }
                          }
                      }
                      true
                  }
                  w.addView(v, lp)
                  bubble = v
              }

              private fun hideBubble() {
                  val v = bubble ?: return
                  try {
                      wm?.removeView(v)
                  } catch (e: Exception) {
                  }
                  bubble = null
              }

              private fun openEditor() {
                  val w = wm ?: return
                  if (editor != null) return
                  val v = PadView(this) { closeEditor(true) }
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  w.addView(v, lp)
                  editor = v
                  bubble?.visibility = View.GONE
              }

              private fun closeEditor(save: Boolean) {
                  val v = editor ?: return
                  if (save) v.saveAll()
                  try {
                      wm?.removeView(v)
                  } catch (e: Exception) {
                  }
                  editor = null
                  bubble?.visibility = View.VISIBLE
              }

              override fun onKeyEvent(event: KeyEvent): Boolean {
                  val ed = editor
                  if (ed != null) {
                      if (event.action == KeyEvent.ACTION_DOWN) ed.note(event.keyCode)
                      return Pad.isMappable(event.keyCode)
                  }
                  if (Pad.paused) return false
                  val p = Pad.load(this, event.keyCode) ?: return false
                  if (!p.third) return false
                  if (event.action == KeyEvent.ACTION_DOWN && event.repeatCount == 0) tap(p.first, p.second)
                  return true
              }

              private fun tap(fx: Float, fy: Float) {
                  val dm = Pad.real(this)
                  val path = Path()
                  path.moveTo(fx * dm.widthPixels, fy * dm.heightPixels)
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 60))
                      .build()
                  dispatchGesture(g, object : AccessibilityService.GestureResultCallback() {
                      override fun onCancelled(gestureDescription: GestureDescription?) {
                          Toast.makeText(this@PadService, "Ketukan dibatalkan oleh sistem", Toast.LENGTH_SHORT).show()
                      }
                  }, null)
              }
          }
          EOF
          mkdir -p app/src/main/java/com/rizal/padmap
          cat > app/src/main/java/com/rizal/padmap/MainActivity.kt <<'EOF'
          package com.rizal.padmap

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView

          class MainActivity : Activity() {
              private lateinit var dot: View
              private lateinit var st: TextView
              private lateinit var sw: Switch
              private lateinit var keys: TextView
              private lateinit var hint: TextView

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun bg(color: String, r: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(Color.parseColor(color))
                  g.cornerRadius = dp(r).toFloat()
                  return g
              }

              private fun tv(t: String, size: Float, color: String = "#FFFFFF", bold: Boolean = false): TextView {
                  val x = TextView(this)
                  x.text = t
                  x.textSize = size
                  x.setTextColor(Color.parseColor(color))
                  if (bold) x.setTypeface(null, Typeface.BOLD)
                  return x
              }

              private fun card(): LinearLayout {
                  val l = LinearLayout(this)
                  l.orientation = LinearLayout.VERTICAL
                  l.setPadding(dp(16), dp(16), dp(16), dp(16))
                  l.background = bg("#1B2438", 16)
                  val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  lp.bottomMargin = dp(12)
                  l.layoutParams = lp
                  return l
              }

              private fun btn(t: String, primary: Boolean, f: () -> Unit): Button {
                  val b = Button(this)
                  b.text = t
                  b.isAllCaps = false
                  b.setTextColor(Color.parseColor(if (primary) "#08331F" else "#FFFFFF"))
                  b.background = bg(if (primary) "#2FA36B" else "#2B3650", 12)
                  b.setOnClickListener { f() }
                  val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(48))
                  lp.topMargin = dp(10)
                  b.layoutParams = lp
                  return b
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(dp(18), dp(28), dp(18), dp(28))
                  root.addView(tv("PadMap", 30f, "#FFFFFF", true))
                  val sub = tv("Ubah tombol gamepad jadi ketukan layar", 14f, "#9AA6C0")
                  sub.setPadding(0, 0, 0, dp(18))
                  root.addView(sub)

                  val c1 = card()
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  dot = View(this)
                  val dlp = LinearLayout.LayoutParams(dp(12), dp(12))
                  dlp.rightMargin = dp(10)
                  dot.layoutParams = dlp
                  st = tv("", 16f, "#FFFFFF", true)
                  row.addView(dot)
                  row.addView(st)
                  c1.addView(row)
                  hint = tv("Kalau tombol izin tidak bisa ditekan, matikan sementara bola bantuan atau aplikasi pengambang lain, lalu nyalakan lagi setelah PadMap aktif.", 13f, "#9AA6C0")
                  hint.setPadding(0, dp(10), 0, 0)
                  c1.addView(hint)
                  c1.addView(btn("Buka pengaturan Aksesibilitas", true) { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) })
                  root.addView(c1)

                  val c2 = card()
                  sw = Switch(this)
                  sw.text = "Bola melayang"
                  sw.setTextColor(Color.WHITE)
                  sw.textSize = 16f
                  c2.addView(sw)
                  val d2 = tv("Ketuk bola PM untuk membuka pemetaan di atas game. Tahan bola untuk jeda atau lanjut. Bola bisa digeser.", 13f, "#9AA6C0")
                  d2.setPadding(0, dp(8), 0, 0)
                  c2.addView(d2)
                  root.addView(c2)

                  val c3 = card()
                  c3.addView(tv("Tombol aktif", 14f, "#9AA6C0"))
                  keys = tv("", 16f, "#FFFFFF", true)
                  c3.addView(keys)
                  root.addView(c3)

                  val c4 = card()
                  c4.addView(tv("Cara pakai", 14f, "#9AA6C0"))
                  val how = tv("1. Aktifkan PadMap di Aksesibilitas.\n2. Buka game, lalu ketuk bola PM.\n3. Seret lingkaran ke tombol di layar game, lalu Simpan.\n4. Tekan tombol gamepad untuk mengetuk titik itu.\n\nTombol yang belum ada di daftar akan muncul sendiri saat kamu menekannya di mode pemetaan.", 15f)
                  how.setPadding(0, dp(6), 0, 0)
                  c4.addView(how)
                  root.addView(c4)

                  root.addView(btn("Reset pemetaan", false) {
                      Pad.resetKeys(this)
                      onResume()
                  })
                  val sv = ScrollView(this)
                  sv.setBackgroundColor(Color.parseColor("#0F1626"))
                  sv.addView(root)
                  setContentView(sv)
              }

              override fun onResume() {
                  super.onResume()
                  val list = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: ""
                  val en = list.contains(packageName)
                  st.text = if (en) "Layanan aktif" else "Layanan belum aktif"
                  hint.visibility = if (en) View.GONE else View.VISIBLE
                  val g = GradientDrawable()
                  g.shape = GradientDrawable.OVAL
                  g.setColor(Color.parseColor(if (en) "#2FA36B" else "#E5534B"))
                  dot.background = g
                  sw.setOnCheckedChangeListener(null)
                  sw.isChecked = Pad.bubbleOn(this)
                  sw.setOnCheckedChangeListener { _, on ->
                      Pad.setBubble(this, on)
                      PadService.inst?.refresh()
                  }
                  val act = Pad.all(this).filter { Pad.load(this, it.first)?.third == true }.map { it.second }
                  keys.text = if (act.isEmpty()) "Belum diatur" else act.joinToString(", ")
              }
          }
          EOF
          mkdir -p app/src/main/java/com/rizal/padmap
          cat > app/src/main/java/com/rizal/padmap/PadView.kt <<'EOF'
          package com.rizal.padmap

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.os.SystemClock
          import android.view.MotionEvent
          import android.view.View
          import android.widget.Toast

          class PadView(c: Context, private val onDone: () -> Unit) : View(c) {
              private class Item(val code: Int, val label: String, var x: Float, var y: Float, var on: Boolean)

              private val d = resources.displayMetrics.density
              private val items = ArrayList<Item>()
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rSave = RectF()
              private val rReset = RectF()
              private val loc = IntArray(2)
              private var cur = -1
              private var press = 0
              private var downX = 0f
              private var downY = 0f
              private var moved = false
              private var flashIdx = -1
              private var flashUntil = 0L

              private fun defX(i: Int) = 0.12f + 0.09f * (i % 9)
              private fun defY(i: Int) = 0.4f + 0.16f * (i / 9)

              init {
                  Pad.all(c).forEachIndexed { i, k ->
                      val s = Pad.load(c, k.first)
                      items.add(Item(k.first, k.second, s?.first ?: defX(i), s?.second ?: defY(i), s?.third ?: (i < 4)))
                  }
              }

              fun saveAll() {
                  items.forEach { Pad.save(context, it.code, it.x, it.y, it.on) }
              }

              fun note(code: Int) {
                  var i = items.indexOfFirst { it.code == code }
                  if (i < 0) {
                      if (!Pad.isMappable(code)) return
                      Pad.addExtra(context, code)
                      i = items.size
                      items.add(Item(code, Pad.label(code), defX(i), defY(i), true))
                      Toast.makeText(context, "Tombol baru terdeteksi: " + Pad.label(code), Toast.LENGTH_SHORT).show()
                  }
                  flashIdx = i
                  flashUntil = SystemClock.uptimeMillis() + 450
                  invalidate()
                  postInvalidateDelayed(500)
              }

              private fun button(cv: Canvas, r: RectF, label: String, color: Int, textColor: Int) {
                  paint.style = Paint.Style.FILL
                  paint.color = color
                  cv.drawRoundRect(r, 12 * d, 12 * d, paint)
                  paint.color = textColor
                  paint.textAlign = Paint.Align.CENTER
                  paint.textSize = 14 * d
                  paint.isFakeBoldText = true
                  cv.drawText(label, r.centerX(), r.centerY() + 5 * d, paint)
                  paint.isFakeBoldText = false
              }

              override fun onDraw(cv: Canvas) {
                  val w = width.toFloat()
                  getLocationOnScreen(loc)
                  val dm = Pad.real(context)
                  val rw = dm.widthPixels.toFloat()
                  val rh = dm.heightPixels.toFloat()
                  cv.drawColor(Color.argb(150, 8, 12, 22))
                  paint.style = Paint.Style.FILL
                  paint.textAlign = Paint.Align.LEFT
                  paint.color = Color.WHITE
                  paint.textSize = 18 * d
                  paint.isFakeBoldText = true
                  cv.drawText("Mode pemetaan", 20 * d, 36 * d, paint)
                  paint.isFakeBoldText = false
                  paint.textSize = 12 * d
                  paint.color = Color.argb(215, 255, 255, 255)
                  cv.drawText("Seret lingkaran ke tombol di layar game. Ketuk lingkaran untuk aktif atau mati.", 20 * d, 56 * d, paint)
                  cv.drawText("Tekan tombol gamepad: lingkarannya berkedip. Tombol baru muncul otomatis.", 20 * d, 72 * d, paint)
                  rSave.set(w - 150 * d, 14 * d, w - 16 * d, 58 * d)
                  rReset.set(w - 310 * d, 14 * d, w - 166 * d, 58 * d)
                  button(cv, rSave, "Simpan", Color.rgb(47, 163, 107), Color.rgb(8, 51, 31))
                  button(cv, rReset, "Atur ulang", Color.rgb(43, 54, 80), Color.WHITE)
                  val now = SystemClock.uptimeMillis()
                  items.forEachIndexed { i, it ->
                      val cx = it.x * rw - loc[0]
                      val cy = it.y * rh - loc[1]
                      val r = 26 * d
                      if (i == flashIdx && now < flashUntil) {
                          paint.style = Paint.Style.FILL
                          paint.color = Color.argb(200, 255, 210, 74)
                          cv.drawCircle(cx, cy, r + 9 * d, paint)
                      }
                      paint.style = Paint.Style.FILL
                      paint.color = if (it.on) Color.argb(235, 47, 163, 107) else Color.argb(160, 90, 96, 110)
                      cv.drawCircle(cx, cy, r, paint)
                      paint.style = Paint.Style.STROKE
                      paint.strokeWidth = 2 * d
                      paint.color = Color.argb(if (it.on) 230 else 110, 255, 255, 255)
                      cv.drawCircle(cx, cy, r, paint)
                      paint.style = Paint.Style.FILL
                      paint.color = Color.WHITE
                      paint.textAlign = Paint.Align.CENTER
                      paint.textSize = 11 * d
                      cv.drawText(it.label, cx, cy + 4 * d, paint)
                  }
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  val dm = Pad.real(context)
                  val rw = dm.widthPixels.toFloat()
                  val rh = dm.heightPixels.toFloat()
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          press = if (rSave.contains(e.x, e.y)) 1 else if (rReset.contains(e.x, e.y)) 2 else 0
                          cur = -1
                          if (press == 0) {
                              var best = 40 * d
                              items.forEachIndexed { i, it ->
                                  val dist = Math.hypot((it.x * rw - e.rawX).toDouble(), (it.y * rh - e.rawY).toDouble()).toFloat()
                                  if (dist < best) {
                                      best = dist
                                      cur = i
                                  }
                              }
                          }
                          downX = e.rawX
                          downY = e.rawY
                          moved = false
                      }
                      MotionEvent.ACTION_MOVE -> {
                          if (cur >= 0) {
                              if (Math.hypot((e.rawX - downX).toDouble(), (e.rawY - downY).toDouble()) > 12 * d) moved = true
                              if (moved) {
                                  items[cur].x = (e.rawX / rw).coerceIn(0f, 1f)
                                  items[cur].y = (e.rawY / rh).coerceIn(0f, 1f)
                                  invalidate()
                              }
                          }
                      }
                      MotionEvent.ACTION_UP -> {
                          if (press == 1) {
                              if (rSave.contains(e.x, e.y)) onDone()
                          } else if (press == 2) {
                              if (rReset.contains(e.x, e.y)) {
                                  items.forEachIndexed { i, it ->
                                      it.x = defX(i)
                                      it.y = defY(i)
                                      it.on = i < 4
                                  }
                                  invalidate()
                              }
                          } else if (cur >= 0) {
                              val it = items[cur]
                              if (!moved) it.on = !it.on
                              Pad.save(context, it.code, it.x, it.y, it.on)
                              invalidate()
                          }
                      }
                  }
                  return true
              }
          }
