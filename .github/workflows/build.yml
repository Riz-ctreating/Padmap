name: Build PadMap APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Tulis file proyek
        run: |
          mkdir -p .
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "PadMap"
          include(":app")
          EOF
          mkdir -p .
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          mkdir -p .
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.rizal.padmap"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.rizal.padmap"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="@string/app_name" android:theme="@android:style/Theme.DeviceDefault.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".CalibrateActivity" android:exported="false" />
                  <service
                      android:name=".PadService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">PadMap</string>
              <string name="desc">Mengubah tombol gamepad menjadi ketukan layar di titik yang kamu atur. Tidak membaca isi layar.</string>
          </resources>
          EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents"
              android:canPerformGestures="true"
              android:canRequestFilterKeyEvents="true"
              android:description="@string/desc"
              android:notificationTimeout="100" />
          EOF
          mkdir -p app/src/main/java/com/rizal/padmap
          cat > app/src/main/java/com/rizal/padmap/Pad.kt <<'EOF'
          package com.rizal.padmap

          import android.content.Context
          import android.view.KeyEvent

          object Pad {
              val keys = listOf(
                  KeyEvent.KEYCODE_BUTTON_A to "A", KeyEvent.KEYCODE_BUTTON_B to "B",
                  KeyEvent.KEYCODE_BUTTON_X to "X", KeyEvent.KEYCODE_BUTTON_Y to "Y",
                  KeyEvent.KEYCODE_BUTTON_L1 to "LB", KeyEvent.KEYCODE_BUTTON_R1 to "RB",
                  KeyEvent.KEYCODE_BUTTON_L2 to "LT", KeyEvent.KEYCODE_BUTTON_R2 to "RT",
                  KeyEvent.KEYCODE_BUTTON_THUMBL to "L3", KeyEvent.KEYCODE_BUTTON_THUMBR to "R3",
                  KeyEvent.KEYCODE_DPAD_UP to "Atas", KeyEvent.KEYCODE_DPAD_DOWN to "Bawah",
                  KeyEvent.KEYCODE_DPAD_LEFT to "Kiri", KeyEvent.KEYCODE_DPAD_RIGHT to "Kanan"
              )

              fun prefs(c: Context) = c.getSharedPreferences("pad", Context.MODE_PRIVATE)

              fun load(c: Context, code: Int): Triple<Float, Float, Boolean>? {
                  val s = prefs(c).getString("k$code", null) ?: return null
                  val p = s.split(",")
                  return Triple(p[0].toFloat(), p[1].toFloat(), p[2] == "1")
              }

              fun save(c: Context, code: Int, x: Float, y: Float, on: Boolean) {
                  prefs(c).edit().putString("k$code", "$x,$y,${if (on) 1 else 0}").apply()
              }
          }
          EOF
          mkdir -p app/src/main/java/com/rizal/padmap
          cat > app/src/main/java/com/rizal/padmap/PadService.kt <<'EOF'
          package com.rizal.padmap

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.util.DisplayMetrics
          import android.view.KeyEvent
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent

          class PadService : AccessibilityService() {
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onKeyEvent(event: KeyEvent): Boolean {
                  val p = Pad.load(this, event.keyCode) ?: return false
                  if (!p.third) return false
                  if (event.action == KeyEvent.ACTION_DOWN && event.repeatCount == 0) tap(p.first, p.second)
                  return true
              }

              private fun tap(fx: Float, fy: Float) {
                  val dm = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  (getSystemService(WINDOW_SERVICE) as WindowManager).defaultDisplay.getRealMetrics(dm)
                  val path = Path().apply { moveTo(fx * dm.widthPixels, fy * dm.heightPixels) }
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 40))
                      .build()
                  dispatchGesture(g, null, null)
              }
          }
          EOF
          mkdir -p app/src/main/java/com/rizal/padmap
          cat > app/src/main/java/com/rizal/padmap/MainActivity.kt <<'EOF'
          package com.rizal.padmap

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {
              private lateinit var st: TextView

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val l = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 60, 40, 40)
                  }
                  val t = TextView(this).apply {
                      text = "PadMap\n\n1. Aktifkan layanan PadMap di pengaturan Aksesibilitas.\n2. Atur posisi tombol.\n3. Buka game dalam mode landscape lalu tekan tombol gamepad.\n\nSatu tombol = satu ketukan di titik yang kamu atur."
                      textSize = 16f
                  }
                  st = TextView(this).apply {
                      textSize = 16f
                      setPadding(0, 30, 0, 30)
                  }
                  fun btn(txt: String, f: () -> Unit) = Button(this).apply {
                      text = txt
                      setOnClickListener { f() }
                  }
                  l.addView(t)
                  l.addView(st)
                  l.addView(btn("Buka pengaturan Aksesibilitas") { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) })
                  l.addView(btn("Atur posisi tombol") { startActivity(Intent(this, CalibrateActivity::class.java)) })
                  l.addView(btn("Reset semua") { Pad.prefs(this).edit().clear().apply() })
                  setContentView(ScrollView(this).apply { addView(l) })
              }

              override fun onResume() {
                  super.onResume()
                  val en = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: ""
                  st.text = if (en.contains(packageName)) "Layanan: AKTIF" else "Layanan: belum aktif"
              }
          }
          EOF
          mkdir -p app/src/main/java/com/rizal/padmap
          cat > app/src/main/java/com/rizal/padmap/CalibrateActivity.kt <<'EOF'
          package com.rizal.padmap

          import android.app.Activity
          import android.content.Context
          import android.content.pm.ActivityInfo
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.os.Bundle
          import android.view.MotionEvent
          import android.view.View

          class CalibrateActivity : Activity() {
              private lateinit var pv: PadView

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                  @Suppress("DEPRECATION")
                  window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  pv = PadView(this)
                  setContentView(pv)
              }

              override fun onPause() {
                  super.onPause()
                  pv.saveAll()
              }
          }

          class PadView(c: Context) : View(c) {
              private val n = Pad.keys.size
              private val xs = FloatArray(n)
              private val ys = FloatArray(n)
              private val on = BooleanArray(n)
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private var cur = -1
              private var downX = 0f
              private var downY = 0f
              private var moved = false

              init {
                  Pad.keys.forEachIndexed { i, k ->
                      val s = Pad.load(c, k.first)
                      xs[i] = s?.first ?: (0.15f + 0.1f * (i % 8))
                      ys[i] = s?.second ?: (0.3f + 0.2f * (i / 8))
                      on[i] = s?.third ?: (i < 4)
                  }
              }

              fun saveAll() {
                  Pad.keys.forEachIndexed { i, k -> Pad.save(context, k.first, xs[i], ys[i], on[i]) }
              }

              override fun onDraw(cv: Canvas) {
                  cv.drawColor(Color.argb(235, 12, 18, 30))
                  paint.style = Paint.Style.FILL
                  paint.textAlign = Paint.Align.CENTER
                  paint.color = Color.WHITE
                  paint.textSize = 30f
                  cv.drawText("Seret lingkaran ke posisi tombol di game. Ketuk lingkaran untuk aktif/mati. Tekan Kembali jika selesai.", width / 2f, 60f, paint)
                  Pad.keys.forEachIndexed { i, k ->
                      val cx = xs[i] * width
                      val cy = ys[i] * height
                      paint.color = if (on[i]) Color.rgb(47, 163, 107) else Color.argb(120, 120, 120, 120)
                      cv.drawCircle(cx, cy, 52f, paint)
                      paint.color = Color.WHITE
                      paint.textSize = 28f
                      cv.drawText(k.second, cx, cy + 10f, paint)
                  }
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          cur = -1
                          var best = 90f
                          for (i in 0 until n) {
                              val d = Math.hypot((xs[i] * width - e.x).toDouble(), (ys[i] * height - e.y).toDouble()).toFloat()
                              if (d < best) { best = d; cur = i }
                          }
                          downX = e.x
                          downY = e.y
                          moved = false
                      }
                      MotionEvent.ACTION_MOVE -> if (cur >= 0) {
                          if (Math.hypot((e.x - downX).toDouble(), (e.y - downY).toDouble()) > 12) moved = true
                          if (moved) {
                              xs[cur] = (e.x / width).coerceIn(0f, 1f)
                              ys[cur] = (e.y / height).coerceIn(0f, 1f)
                              invalidate()
                          }
                      }
                      MotionEvent.ACTION_UP -> if (cur >= 0) {
                          if (!moved) on[cur] = !on[cur]
                          Pad.save(context, Pad.keys[cur].first, xs[cur], ys[cur], on[cur])
                          invalidate()
                      }
                  }
                  return true
              }
          }
          EOF
      - name: Bangun APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PadMap-apk
          path: app/build/outputs/apk/debug/app-debug.apk
